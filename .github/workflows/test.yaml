name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-shared-account
  queue: max

jobs:
  vitest:
    uses: finki-hub/.github/.github/workflows/vitest.yaml@main
    with:
      node-versions: '["24", "26"]'
      max-parallel: 1
      test-args: ""
      required-status: true
      cancel-in-progress: false
    secrets:
      CAS_USERNAME: ${{ secrets.CAS_USERNAME }}
      CAS_PASSWORD: ${{ secrets.CAS_PASSWORD }}
